name: Import VIOTORIIA source
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
      - "IMPORT_SOURCE"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and extract website source
        run: |
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3LXKNlzLOs2jmGsBXwh0UhR766e/398ec38e-5213-4acf-9d16-f487868d8561.zip" -o /tmp/viotoriia.zip
          unzip -q /tmp/viotoriia.zip -d .
          test -f app/package.json
          test -f app/src/routes/index.tsx || find app/src/routes -maxdepth 2 -type f | head
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Import VIOTORIIA website source" || echo "No source changes"
          git push
